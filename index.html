<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REVERE MONITOR · NEWS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  /* ── Slate-Linen theme (matches index.html) ── */
  --bg:   #eef0f4;
  --bg2:  #f7f8fa;
  --bg3:  #e3e6ec;
  --bg4:  #d6dae4;
  --border:  #c8cdd8;
  --border2: #adb4c4;
  --text:    #1a1d24;
  --text-dim:#3a4055;
  --text-mute:#7a84a0;
  --accent:  #2d5be3;
  --accent-dim: rgba(45,91,227,.10);
  --orange:  #e06c2a;
  --gold:    #c8960a;
  --red:     #c73535;
  --green:   #1f8a4c;
  --blue:    #2d5be3;
  --maroon:  #8b1a1a;
  --serif:   'DM Serif Display', Georgia, serif;
  --sans:    'DM Sans', system-ui, sans-serif;
  --mono:    'DM Mono', 'Courier New', monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;display:flex;flex-direction:column;}

/* ── HEADER ── */
#header{background:#111827;border-bottom:3px solid var(--accent);padding:0 16px;height:60px;display:flex;align-items:center;gap:0;flex-shrink:0;box-shadow:0 2px 16px rgba(0,0,0,.18);}
#wordmark{font-family:var(--serif);font-size:20px;font-weight:400;letter-spacing:2px;color:#f0f2f7;font-style:italic;}
#wordmark strong{font-style:normal;color:#7eb3ff;font-family:var(--mono);font-size:12px;letter-spacing:4px;text-transform:uppercase;vertical-align:middle;margin-left:8px;}
.hd{width:1px;height:26px;background:#2a3045;margin:0 14px;}
#hs{flex:1;}
a.backlink{font-family:var(--mono);font-size:11px;color:#8a96b8;text-decoration:none;border:1px solid #2a3045;border-radius:4px;padding:4px 10px;background:#252d42;letter-spacing:.5px;}
a.backlink:hover{color:#7eb3ff;border-color:var(--accent);}
#upd-hdr{font-size:11px;color:#5a6480;font-family:var(--mono);margin-left:14px;}

/* ── SEARCH ── */
#searchwrap{padding:8px 16px 0;flex-shrink:0;}
#searchbox{width:100%;max-width:420px;background:var(--bg2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 12px;outline:none;}
#searchbox:focus{border-color:var(--accent);}

/* ── TABS ── */
#tabs{display:flex;gap:4px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;flex-wrap:wrap;}
#tabs::-webkit-scrollbar{display:none;}
.tab{font-size:11px;padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--text-mute);white-space:nowrap;font-family:var(--mono);font-weight:400;letter-spacing:.3px;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500;}
.tab:not(.active):hover{background:var(--bg4);color:var(--text);}
.tab .cnt{font-size:9px;opacity:.7;background:rgba(0,0,0,.12);border-radius:8px;padding:0 5px;}
.tab.active .cnt{background:rgba(255,255,255,.22);}

/* ── FEED ── */
#feedwrap{flex:1;overflow-y:auto;padding:0 16px 40px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent;}
#feed{max-width:820px;margin:0 auto;display:flex;flex-direction:column;}
.daygroup{margin-top:18px;}
.dayhdr{font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-mute);padding:6px 0;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--bg);z-index:5;}

/* news item (matches .ni in index.html, with a source pill added) */
a.ni{display:flex;flex-direction:column;gap:3px;padding:11px 0;border-bottom:1px solid var(--border);text-decoration:none;color:inherit;}
a.ni:last-child{border-bottom:none;}
a.ni:hover{background:var(--bg3);margin:0 -14px;padding-left:14px;padding-right:14px;}
.ni-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.ni-src{font-size:9px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono);}
.ni-pill{font-size:8px;font-weight:600;padding:2px 7px;border-radius:10px;letter-spacing:.8px;text-transform:uppercase;font-family:var(--mono);color:#fff;flex-shrink:0;}
.ni-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.4;}
a.ni:hover .ni-title{color:var(--accent);}
.ni-date{font-size:10px;color:var(--text-mute);font-family:var(--mono);}
.ni-snippet{font-size:11px;color:var(--text-dim);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.empty{color:var(--text-mute);font-size:13px;padding:40px;text-align:center;}
#loadmore{margin:20px auto;display:block;padding:8px 20px;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text-dim);font-family:var(--mono);font-size:12px;cursor:pointer;}
#loadmore:hover{border-color:var(--accent);color:var(--accent);}
</style>
</head>
<body>

<div id="header">
  <span id="wordmark">Revere Monitor<strong>News v2</strong></span>
  <div class="hd"></div>
  <a class="backlink" href="index.html">← Dashboard</a>
  <span id="hs"></span>
  <span id="upd-hdr">loading…</span>
</div>

<div id="searchwrap">
  <input id="searchbox" type="search" placeholder="Filter stories by keyword…" autocomplete="off">
</div>

<div id="tabs"><!-- tabs injected --></div>

<div id="feedwrap">
  <div id="feed"><div class="empty">Loading news…</div></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  SOURCE / TOPIC MAP
//  Each entry maps a data.json key -> a tab. Multiple keys can share a
//  tab. `topic` groups sources into topic tabs; `label`+`color` drive
//  the per-item source pill. Order here = order feeds merge in.
// ══════════════════════════════════════════════════════════════════
const FEEDS = [
  // key                    label            color       topic
  ['news_revere',           'Revere',        '#2d5be3',  'Local'],
  ['news_communities',      'Communities',   '#0891b2',  'Local'],
  ['news_boston',           'Boston',        '#c73535',  'Metro'],
  ['news_universalhub',     'Universal Hub', '#d44a1a',  'Metro'],
  ['news_ma_transit',       'MA Transit',    '#1f8a4c',  'Transit & Housing'],
  ['news_logan',            'Logan Airport', '#7a84a0',  'Transit & Housing'],
  ['news_national',         'National',      '#3a4055',  'National'],
  ['news_ktn',              'Breaking',      '#c8960a',  'National'],
  ['news_substack',         'Substack',      '#9333ea',  'National'],
  ['news_sports',           'My Sports',     '#e06c2a',  'Sports'],
  ['news_espn',             'ESPN',          '#c73535',  'Sports'],
  ['news_bc',               'Boston College','#8b1a1a',  'Sports'],
  ['news_bc_hockey',        'BC Hockey',     '#8b1a1a',  'Sports'],
  ['news_college_hockey',   'College Hockey','#6b3fa0',  'Sports'],
  ['news_hockey_east',      'Hockey East',   '#6b3fa0',  'Sports'],
];

// Topic tab order (left → right after "All")
const TOPIC_ORDER = ['Local','Metro','Transit & Housing','National','Sports'];

// ── helpers (ported from index.html for visual parity) ──────────────
function stripHtml(h){if(!h)return'';return h.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();}
function itemTs(it){return it.ts ? it.ts : (it.published ? Date.parse(it.published)/1000 : 0);}
function fmtDateTime(ts,pub){
  const d=ts?new Date(ts*1000):(pub?new Date(pub):null);
  if(!d||isNaN(d))return'';
  try{return d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}catch{return'';}
}
function dayLabel(ts){
  if(!ts) return 'Undated';
  const d=new Date(ts*1000); const now=new Date();
  const strip=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
  const diff=Math.round((strip(now)-strip(d))/86400000);
  if(diff===0)return 'Today';
  if(diff===1)return 'Yesterday';
  if(diff<7)return d.toLocaleDateString('en-US',{weekday:'long'});
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}

// ── state ───────────────────────────────────────────────────────────
let ALL = [];             // flattened, deduped, sorted items
let activeTab = 'all';    // 'all' | topic name | feed label
let query = '';
let shown = 0;
const PAGE = 60;

// ── build the unified item list ─────────────────────────────────────
function ingest(data){
  const seen = new Set();
  const out = [];
  for(const [key,label,color,topic] of FEEDS){
    const arr = data[key] || [];
    for(const it of arr){
      const link = it.link || '';
      const dedupeKey = link || (label+'|'+(it.title||''));
      if(seen.has(dedupeKey)) continue;
      seen.add(dedupeKey);
      out.push({
        title: it.title || '(untitled)',
        link,
        ts: itemTs(it),
        published: it.published || '',
        // keep the item's own source string if present (e.g. community name,
        // "Google News · X"), else fall back to the feed label
        srcText: it.source || label,
        feedLabel: label,
        color,
        topic,
        snippet: stripHtml(it.summary || it.description || it.content || ''),
      });
    }
  }
  out.sort((a,b)=>b.ts-a.ts);
  return out;
}

// ── tabs ────────────────────────────────────────────────────────────
function buildTabs(){
  const wrap=document.getElementById('tabs');
  const tabs=[];
  tabs.push({id:'all',label:'All',count:ALL.length});
  // topic tabs
  for(const t of TOPIC_ORDER){
    const n=ALL.filter(x=>x.topic===t).length;
    if(n) tabs.push({id:'topic:'+t,label:t,count:n});
  }
  // a divider look isn't needed; append per-source tabs after topics
  const bySource=new Map();
  for(const f of FEEDS){
    const n=ALL.filter(x=>x.feedLabel===f[1]).length;
    if(n) bySource.set(f[1],{id:'src:'+f[1],label:f[1],count:n,color:f[2]});
  }
  for(const v of bySource.values()) tabs.push(v);

  wrap.innerHTML='';
  for(const t of tabs){
    const el=document.createElement('button');
    el.className='tab'+((activeTab===t.id)?' active':'');
    el.dataset.id=t.id;
    let dot = t.color ? `<span style="width:7px;height:7px;border-radius:50%;background:${t.color};display:inline-block;"></span>` : '';
    el.innerHTML = dot + `<span>${t.label}</span><span class="cnt">${t.count}</span>`;
    el.onclick=()=>{activeTab=t.id; shown=0; buildTabs(); renderFeed();};
    wrap.appendChild(el);
  }
}

// ── filter for current tab + query ──────────────────────────────────
function currentItems(){
  let items=ALL;
  if(activeTab.startsWith('topic:')){
    const t=activeTab.slice(6); items=items.filter(x=>x.topic===t);
  }else if(activeTab.startsWith('src:')){
    const s=activeTab.slice(4); items=items.filter(x=>x.feedLabel===s);
  }
  if(query){
    const q=query.toLowerCase();
    items=items.filter(x=>(x.title+' '+x.snippet+' '+x.srcText).toLowerCase().includes(q));
  }
  return items;
}

// ── render ──────────────────────────────────────────────────────────
function itemEl(it){
  const a=document.createElement('a');
  a.className='ni';
  a.href=it.link||'#'; a.target='_blank'; a.rel='noopener noreferrer';
  const pill=`<span class="ni-pill" style="background:${it.color}">${it.feedLabel}</span>`;
  // if the item's own source differs from the feed label, show it too
  const srcExtra = (it.srcText && it.srcText!==it.feedLabel) ? `<span class="ni-src">${it.srcText}</span>` : '';
  let inner=`<div class="ni-top">${pill}${srcExtra}</div>`;
  inner+=`<div class="ni-title">${it.title}</div>`;
  if(it.snippet && it.snippet.length>30) inner+=`<div class="ni-snippet">${it.snippet.slice(0,200)}</div>`;
  if(it.ts||it.published) inner+=`<div class="ni-date">${fmtDateTime(it.ts,it.published)}</div>`;
  a.innerHTML=inner;
  return a;
}

function renderFeed(){
  const feed=document.getElementById('feed');
  const items=currentItems();
  if(!items.length){feed.innerHTML='<div class="empty">No stories match.</div>';return;}
  if(shown===0) shown=Math.min(PAGE,items.length); else shown=Math.min(shown,items.length);
  const slice=items.slice(0,shown);

  feed.innerHTML='';
  let lastDay=null, group=null;
  for(const it of slice){
    const dl=dayLabel(it.ts);
    if(dl!==lastDay){
      group=document.createElement('div'); group.className='daygroup';
      const h=document.createElement('div'); h.className='dayhdr'; h.textContent=dl;
      group.appendChild(h); feed.appendChild(group); lastDay=dl;
    }
    group.appendChild(itemEl(it));
  }
  if(shown<items.length){
    const btn=document.createElement('button'); btn.id='loadmore';
    btn.textContent=`Load more (${items.length-shown} older)`;
    btn.onclick=()=>{shown+=PAGE; renderFeed(); };
    feed.appendChild(btn);
  }
}

// ── search box ──────────────────────────────────────────────────────
document.getElementById('searchbox').addEventListener('input',e=>{
  query=e.target.value.trim(); shown=0; renderFeed();
});

// ── boot ────────────────────────────────────────────────────────────
(async function init(){
  try{
    const r=await fetch('data.json?_='+Date.now());
    const data=await r.json();
    ALL=ingest(data);
    document.getElementById('upd-hdr').textContent=
      data.updated_local ? ('Updated '+data.updated_local) : (ALL.length+' stories');
    buildTabs();
    renderFeed();
  }catch(e){
    document.getElementById('feed').innerHTML=
      '<div class="empty">Could not load data.json — make sure this page sits in the same folder as your dashboard.<br><small>'+e+'</small></div>';
    document.getElementById('upd-hdr').textContent='load failed';
  }
})();
</script>
</body>
</html>
